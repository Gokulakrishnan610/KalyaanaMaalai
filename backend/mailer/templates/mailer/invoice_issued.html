{% extends "mailer/base.html" %}
{% block body %}<p>Hello {{ name }},</p><p>A payment of <b>Rs {{ amount }}</b> ({{ title }}) is due{% if due_date %} by <b>{{ due_date }}</b>{% endif %} for {{ wedding }}.</p><p style="margin:24px 0;"><a href="{{ link }}" style="background:#7a1f3d;color:#fff;padding:12px 22px;border-radius:24px;text-decoration:none;font-weight:bold;">Pay online</a></p><p>You can also pay by UPI, bank transfer or cash with your planner.</p>{% endblock %}
