{% extends "mailer/base.html" %}
{% block body %}<p>Hello {{ vendor }},</p><p>We would like a price for <b>{{ category }}</b> for {{ wedding }} on {{ date }}.{% if reply_by %} Please reply by <b>{{ reply_by }}</b>.{% endif %}</p><p style="margin:24px 0;"><a href="{{ link }}" style="background:#7a1f3d;color:#fff;padding:12px 22px;border-radius:24px;text-decoration:none;font-weight:bold;">See the request and reply</a></p>{% endblock %}
