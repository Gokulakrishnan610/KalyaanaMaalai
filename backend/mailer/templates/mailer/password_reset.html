{% extends "mailer/base.html" %}
{% block body %}<p>Hello {{ name }},</p><p>We got a request to reset your password. If it was you, use the button below. The link works for 3 days and only once.</p><p style="margin:24px 0;"><a href="{{ link }}" style="background:#7a1f3d;color:#fff;padding:12px 22px;border-radius:24px;text-decoration:none;font-weight:bold;">Choose a new password</a></p><p>If it was not you, ignore this email. Your password stays the same.</p>{% endblock %}
